<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-container">
        <h1 class="game-title">Tic-Tac-Toe</h1>
        <div id="status" class="game-status" aria-live="polite">Player X's turn</div>
        <div class="board" role="grid" aria-label="Tic-Tac-Toe Board">
            <button class="cell" id="cell-0" role="gridcell" aria-label="Cell 1"></button>
            <button class="cell" id="cell-1" role="gridcell" aria-label="Cell 2"></button>
            <button class="cell" id="cell-2" role="gridcell" aria-label="Cell 3"></button>
            <button class="cell" id="cell-3" role="gridcell" aria-label="Cell 4"></button>
            <button class="cell" id="cell-4" role="gridcell" aria-label="Cell 5"></button>
            <button class="cell" id="cell-5" role="gridcell" aria-label="Cell 6"></button>
            <button class="cell" id="cell-6" role="gridcell" aria-label="Cell 7"></button>
            <button class="cell" id="cell-7" role="gridcell" aria-label="Cell 8"></button>
            <button class="cell" id="cell-8" role="gridcell" aria-label="Cell 9"></button>
        </div>
        <button id="reset" class="reset-button">Restart Game</button>
    </main>
    <script src="script.js"></script>
</body>
</html>
